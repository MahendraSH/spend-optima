<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#8861F3" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    
    <!-- Skin Shadows/Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>
    
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadow Filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Glow Background Circle -->
  <circle cx="160" cy="160" r="145" fill="url(#avatarGlow)" stroke="#4F46E5" stroke-width="4" />

  <!-- Background decorative circular lines -->
  <circle cx="160" cy="160" r="120" stroke="white" stroke-opacity="0.05" stroke-dasharray="10 15" stroke-width="2" fill="none" />
  <circle cx="160" cy="160" r="95" stroke="white" stroke-opacity="0.08" stroke-width="1.5" fill="none" />

  <!-- Avatar Group -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Jacket -->
    <path d="M75 285 C75 235, 100 205, 160 205 C220 205, 245 235, 245 285 L235 320 H85 L75 285 Z" fill="url(#suitGrad)" />
    
    <!-- White Shirt Collar -->
    <path d="M125 205 L160 240 L195 205 C195 205, 190 225, 160 225 C130 225, 125 205, 125 205 Z" fill="#FFFFFF" />
    
    <!-- Purple Tie -->
    <path d="M153 230 L167 230 L172 290 L160 305 L148 290 Z" fill="#8861F3" />
    <path d="M150 225 L170 225 L165 240 L155 240 Z" fill="#7145D6" />

    <!-- Neck -->
    <path d="M135 170 L135 215 C135 230, 185 230, 185 215 L185 170 Z" fill="#FCA5A5" />
    <path d="M135 195 C135 215, 185 215, 185 195 L185 205 C185 220, 135 220, 135 205 Z" fill="#E68A8A" opacity="0.5" /> <!-- Neck shadow -->

    <!-- Ears -->
    <circle cx="112" cy="148" r="11" fill="#FCA5A5" />
    <circle cx="208" cy="148" r="11" fill="#FCA5A5" />
    <circle cx="113" cy="148" r="6" fill="#E68A8A" />
    <circle cx="207" cy="148" r="6" fill="#E68A8A" />

    <!-- Face Shape -->
    <path d="M115 142 C115 95, 205 95, 205 142 C205 185, 182 208, 160 208 C138 208, 115 185, 115 142 Z" fill="#FCA5A5" />

    <!-- Stubble Shadow (Beard shadow) -->
    <path d="M120 160 C120 195, 200 195, 200 160 C200 185, 180 203, 160 203 C140 203, 120 185, 120 160 Z" fill="#1E293B" opacity="0.12" />

    <!-- Modern swoop haircut -->
    <!-- Base Hair -->
    <path d="M113 130 C110 95, 135 75, 165 75 C195 75, 208 95, 207 130 C203 125, 192 118, 165 118 C138 118, 120 125, 113 130 Z" fill="#1E293B" />
    <!-- Styled Hair Swoop Top -->
    <path d="M112 120 C112 90, 138 70, 172 70 C198 70, 212 85, 210 115 C200 102, 188 95, 168 95 C138 95, 122 108, 112 120 Z" fill="#0F172A" />

    <!-- Eyebrows -->
    <path d="M132 131 C138 126, 148 126, 153 129" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M167 129 C172 126, 182 126, 188 131" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Friendly Eyes -->
    <ellipse cx="143" cy="141" rx="4" ry="4.5" fill="#0F172A" />
    <ellipse cx="177" cy="141" rx="4" ry="4.5" fill="#0F172A" />
    
    <!-- Eyes sparkle -->
    <circle cx="144.5" cy="139.5" r="1.2" fill="#FFFFFF" />
    <circle cx="178.5" cy="139.5" r="1.2" fill="#FFFFFF" />

    <!-- Stylish Purple Rimmed Glasses -->
    <rect x="127" y="132" width="28" height="21" rx="6" stroke="#8861F3" stroke-width="3" fill="none" />
    <rect x="165" y="132" width="28" height="21" rx="6" stroke="#8861F3" stroke-width="3" fill="none" />
    <!-- Bridge -->
    <path d="M155 141 L165 141" stroke="#8861F3" stroke-width="3" stroke-linecap="round" />
    <!-- Frame wing-tips -->
    <path d="M127 137 L122 139" stroke="#8861F3" stroke-width="3" stroke-linecap="round" />
    <path d="M193 137 L198 139" stroke="#8861F3" stroke-width="3" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M160 146 L160 159 C160 162, 157 164, 154 164" stroke="#E68A8A" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Happy Confident Smile -->
    <path d="M145 174 C151 183, 169 183, 175 174" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <!-- Smile lines (Dimples) -->
    <path d="M142 173 C142 175, 143 176, 144 177" stroke="#E68A8A" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M178 173 C178 175, 177 176, 176 177" stroke="#E68A8A" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
